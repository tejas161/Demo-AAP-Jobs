---
- name: Discover OpenShift pods
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Get all pods in namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ openshift_namespace }}"
      register: pods

    - name: Display pod count
      ansible.builtin.debug:
        msg: "Found {{ pods.resources | length }} pod(s)"

    - name: Display pod names and labels
      ansible.builtin.debug:
        msg:
          - "Pod: {{ item.metadata.name }}"
          - "Status: {{ item.status.phase }}"
          - "Labels: {{ item.metadata.labels | default({}) }}"
      loop: "{{ pods.resources }}"
