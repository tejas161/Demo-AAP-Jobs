---
- name: Test SentinelOps BuildConfig access
  hosts: localhost
  gather_facts: false

  vars:
    openshift_namespace: "{{ OPENSHIFT_NAMESPACE }}"

  tasks:

    - name: Get all BuildConfigs
      kubernetes.core.k8s_info:
        api_version: build.openshift.io/v1
        kind: BuildConfig
        namespace: "{{ openshift_namespace }}"
      register: buildconfigs
      failed_when: false

    - name: Display BuildConfig result
      ansible.builtin.debug:
        msg:
          - "Failed: {{ buildconfigs.failed | default(false) }}"
          - "BuildConfig count: {{ buildconfigs.resources | default([]) | length }}"
          - "Message: {{ buildconfigs.msg | default('No error') }}"
