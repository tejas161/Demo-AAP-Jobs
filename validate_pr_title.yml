---
# Validates PR title contains a Jira-style key (default: AAP-<digits>).
# Extra vars from AO (webhook → Launch AAP job template):
#   pr_title, pr_number, repo_full_name, pr_action (optional)
- name: Validate PR title for Jira key
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    pr_title: "{{ pr_title | default('') | string }}"
    pr_number: "{{ pr_number | default('') | string }}"
    repo_full_name: "{{ repo_full_name | default('') | string }}"
    pr_action: "{{ pr_action | default('') | string }}"
    # Override in extra_vars if you need ANSTRAT-1234 etc.
    jira_key_pattern: "{{ jira_key_pattern | default('AAP-[0-9]+') }}"
  tasks:
    - name: Fail when pr_title is missing
      ansible.builtin.fail:
        msg: "pr_title extra var is required (pass from AO ${trigger.pr_title})."
      when: pr_title | length == 0

    - name: Check title against Jira key pattern (key may appear anywhere in title)
      ansible.builtin.set_fact:
        pr_compliance: "{{ 'compliant' if (pr_title is search(jira_key_pattern)) else 'non_compliant' }}"
        compliance_reason: >-
          {%- if pr_title is search(jira_key_pattern) -%}
          Title contains a valid Jira key matching {{ jira_key_pattern }}.
          {%- else -%}
          Title must include a Jira key matching {{ jira_key_pattern }} (example: AAP-12345).
          {%- endif -%}

    - name: Publish artifacts for AO Switch
      ansible.builtin.set_stats:
        data:
          pr_compliance: "{{ pr_compliance }}"
          compliant: "{{ pr_compliance == 'compliant' }}"
          reason: "{{ compliance_reason }}"
          pr_title: "{{ pr_title }}"
          pr_number: "{{ pr_number }}"
          repo_full_name: "{{ repo_full_name }}"
          pr_action: "{{ pr_action }}"
        per_host: false
        aggregate: false

    - name: Show validation result
      ansible.builtin.debug:
        msg:
          - "repo={{ repo_full_name }} pr=#{{ pr_number }}"
          - "title={{ pr_title }}"
          - "result={{ pr_compliance }} — {{ compliance_reason }}"
