---
# Pass only: pr_title (required). Optional: pr_number, repo_full_name
# Job template "Extra variables" in Controller must be EMPTY (no {{ pr_title }} defaults).
- name: Validate PR title contains AAP-<number>
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check title
      ansible.builtin.set_fact:
        pr_compliance: "{{ 'compliant' if (pr_title is search('AAP-[0-9]+')) else 'non_compliant' }}"

    - name: Publish for AO Switch
      ansible.builtin.set_stats:
        data:
          pr_compliance: "{{ pr_compliance }}"
        per_host: false

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ pr_compliance }} — {{ pr_title }}"
