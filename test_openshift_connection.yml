---
- name: Test SentinelOps OpenShift build access
  hosts: localhost
  gather_facts: false

  vars:
    openshift_namespace: "{{ lookup('env', 'OPENSHIFT_NAMESPACE') }}"

  tasks:

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - openshift_namespace | length > 0
        fail_msg: "OPENSHIFT_NAMESPACE must be provided."

    - name: Get SentinelOps BuildConfig
      kubernetes.core.k8s_info:
        api_version: build.openshift.io/v1
        kind: BuildConfig
        name: sentinelops
        namespace: "{{ openshift_namespace }}"
      register: sentinelops_buildconfig

    - name: Verify SentinelOps BuildConfig
      ansible.builtin.assert:
        that:
          - sentinelops_buildconfig.resources | length == 1
        fail_msg: >-
          BuildConfig 'sentinelops' was not found.

    - name: Display BuildConfig
      ansible.builtin.debug:
        msg:
          - "Successfully connected to OpenShift!"
          - "BuildConfig: {{ sentinelops_buildconfig.resources[0].metadata.name }}"
          - "Latest build: {{ sentinelops_buildconfig.resources[0].status.lastVersion }}"
